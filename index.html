<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bpmf+Huninn&family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans+TC:wght@100;200;300;400;500;700;900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        var params = new URLSearchParams(location.search)
        if (params.get('ui') === '1') return
        params.set('ui', '1')
        var scale = 1.5
        var frame = document.createElement('iframe')
        frame.title = 'TTAB'
        frame.src = location.pathname + '?' + params.toString() + location.hash
        frame.style.cssText = [
          'position:fixed',
          'left:0',
          'top:0',
          'border:0',
          'width:calc(100vw / ' + scale + ')',
          'height:calc(100dvh / ' + scale + ')',
          'zoom:' + scale,
          'background:#f3efe6',
        ].join(';')
        document.documentElement.style.height = '100%'
        document.documentElement.style.overflow = 'hidden'
        document.body.style.margin = '0'
        document.body.style.height = '100%'
        document.body.style.overflow = 'hidden'
        document.body.style.background = '#f3efe6'
        document.body.replaceChildren(frame)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
